name: Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Run evaluation tests with HTML report
        run: |
          mkdir -p reports
          python -m pytest tests/test_retrieval_evals.py tests/test_rag_evals.py \
            --html=reports/test-report.html \
            --self-contained-html

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p site
          cp reports/test-report.html site/test-report.html
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Travel Insurance Buddy - Test Report</title>
              <style>
                :root {
                  --bg: #0b1220;
                  --card: #111827;
                  --muted: #9ca3af;
                  --text: #f3f4f6;
                  --green: #22c55e;
                  --accent: #60a5fa;
                }
                body {
                  margin: 0;
                  font-family: Arial, Helvetica, sans-serif;
                  background: var(--bg);
                  color: var(--text);
                }
                .wrap {
                  max-width: 960px;
                  margin: 80px auto;
                  padding: 32px;
                }
                .card {
                  background: var(--card);
                  border-radius: 16px;
                  padding: 32px;
                  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
                }
                h1 {
                  margin-top: 0;
                  font-size: 2.2rem;
                }
                .badge {
                  display: inline-block;
                  background: rgba(34, 197, 94, 0.18);
                  color: var(--green);
                  border: 1px solid rgba(34, 197, 94, 0.4);
                  border-radius: 999px;
                  padding: 8px 14px;
                  font-weight: 700;
                  margin-bottom: 18px;
                }
                p {
                  color: var(--muted);
                  line-height: 1.6;
                }
                a.button {
                  display: inline-block;
                  background: var(--accent);
                  color: #08111d;
                  text-decoration: none;
                  padding: 12px 18px;
                  border-radius: 10px;
                  font-weight: 700;
                  margin-top: 14px;
                }
                a.button.secondary {
                  background: transparent;
                  color: var(--text);
                  border: 1px solid rgba(255,255,255,0.2);
                  margin-left: 10px;
                }
              </style>
            </head>
            <body>
              <div class="wrap">
                <div class="card">
                  <div class="badge">CI REPORT</div>
                  <h1>Travel Insurance Buddy</h1>
                  <p>Automated test report for the project integration checks.</p>
                  <p>The latest run is available below and includes the pytest summary, environment details, and pass/fail results.</p>
                  <div>
                    <a class="button" href="test-report.html">Open test report</a>
                    <a class="button secondary" href="https://github.com/santoshmohan/agentic-travel-insurance-buddy">GitHub repo</a>
                  </div>
                </div>
              </div>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/test-report.html
