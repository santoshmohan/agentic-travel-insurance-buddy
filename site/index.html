<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Insurance Buddy - Test Report</title>
    <style>
      :root {
        --bg: #0b1220;
        --card: #111827;
        --muted: #9ca3af;
        --text: #f3f4f6;
        --green: #22c55e;
        --accent: #60a5fa;
      }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 960px;
        margin: 80px auto;
        padding: 32px;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      }
      h1 {
        margin-top: 0;
        font-size: 2.2rem;
      }
      .badge {
        display: inline-block;
        background: rgba(34, 197, 94, 0.18);
        color: var(--green);
        border: 1px solid rgba(34, 197, 94, 0.4);
        border-radius: 999px;
        padding: 8px 14px;
        font-weight: 700;
        margin-bottom: 18px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      a.button {
        display: inline-block;
        background: var(--accent);
        color: #08111d;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 10px;
        font-weight: 700;
        margin-top: 14px;
      }
      a.button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.2);
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="badge">CI REPORT</div>
        <h1>Travel Insurance Buddy</h1>
        <p>Automated test report for the project integration checks.</p>
        <p>The latest run is available below and includes the pytest summary, environment details, and pass/fail results.</p>
        <div>
          <a class="button" href="test-report.html">Open test report</a>
          <a class="button secondary" href="https://github.com/santoshmohan/agentic-travel-insurance-buddy">GitHub repo</a>
        </div>
      </div>
    </div>
  </body>
</html>
